name: Check signal-cli

# Looks for a signal-cli release newer than the one addon/Dockerfile pins, and
# opens a pull request that bumps to it. Signal's servers turn old clients away
# after a few months, so a pin nobody is watching is a send that fails one day
# with no warning; this is the watching.
#
# A patch release (0.14.8 → 0.14.9) is merged without asking, once the image
# has built with it. Anything bigger is left as an open pull request, because
# that is the kind of change to read the release notes for. Either way nothing
# is published: `make addon-release` is still yours.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests", or the last step fails.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  bump:
    # arm64, because that is the image the Pi runs and the only one that gets a
    # third-party libsignal spliced in.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Exits non-zero, failing the run, when there is a new release whose
      # libsignal exquo has not built yet. That is deliberate: the failure mail
      # is how you find out, and next week's run tries again.
      - name: Look for a newer release
        id: bump
        run: |
          addon/scripts/bump-signal-cli.sh
          if git diff --quiet -- addon/Dockerfile; then
            exit 0
          fi
          version="$(sed -n -E 's/^ARG SIGNAL_CLI_VERSION="(.*)"$/\1/p' addon/Dockerfile)"
          # One pull request per release. A branch left behind by one you
          # closed without merging also counts, which is how to say no.
          if git ls-remote --exit-code --heads origin "signal-cli-${version}" > /dev/null; then
            echo "A branch for ${version} already exists."
            exit 0
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          # signal-cli has never left 0.x, so the middle number is its major
          # one in practice: 0.13 → 0.14 was the release that needed Java 25.
          # Only a newer last number, with the first two as they were, counts
          # as small enough to merge unread.
          pinned="$(git show HEAD:addon/Dockerfile | sed -n -E 's/^ARG SIGNAL_CLI_VERSION="(.*)"$/\1/p')"
          echo "pinned=${pinned}" >> "${GITHUB_OUTPUT}"
          newest="$(printf '%s\n%s\n' "${pinned}" "${version}" | sort -V | tail -n 1)"
          if [ "${pinned%.*}" = "${version%.*}" ] && [ "${newest}" = "${version}" ]; then
            echo "automerge=true" >> "${GITHUB_OUTPUT}"
          fi

      # The build is the test: install-signal-cli.sh fails it if the libsignal
      # does not match or is not an aarch64 library, and if the JRE is too old
      # to start this signal-cli. Nothing is pushed.
      - name: Build the image
        if: steps.bump.outputs.version
        run: |
          docker build -f addon/Dockerfile \
            --build-arg BUILD_FROM="$(yq '.build_from.aarch64' addon/build.yaml)" \
            --build-arg BUILD_ARCH=aarch64 \
            .

      - name: Open a pull request
        id: pr
        if: steps.bump.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PINNED: ${{ steps.bump.outputs.pinned }}
          AUTOMERGE: ${{ steps.bump.outputs.automerge }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "signal-cli-${VERSION}"
          git commit -m "Bump signal-cli to ${VERSION}" addon/Dockerfile
          git push origin "signal-cli-${VERSION}"
          {
            echo "[signal-cli ${VERSION}](https://github.com/AsamK/signal-cli/releases/tag/v${VERSION}), with the libsignal and Java it needs. The aarch64 image built with these versions."
            echo
            if [ -n "${AUTOMERGE}" ]; then
              echo "A patch release (${PINNED} → ${VERSION}), so this is merged without waiting for you. It reaches the Pi with the next \`make addon-release VERSION=x.y.z\`."
            else
              echo "More than a patch release (${PINNED} → ${VERSION}), so this is left for you. Read the release notes before merging, then publish with \`make addon-release VERSION=x.y.z\`."
            fi
          } > "${RUNNER_TEMP}/body.md"
          url="$(gh pr create --title "Bump signal-cli to ${VERSION}" --body-file "${RUNNER_TEMP}/body.md")"
          echo "${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      # Rebased rather than squashed or merged, so main gets the one commit
      # under its own subject, which is what the add-on changelog is written
      # from. If this fails the run fails, and the pull request stays open to
      # merge by hand.
      - name: Merge it, if it is a patch release
        if: steps.bump.outputs.automerge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr merge "${URL}" --rebase
          git push origin --delete "signal-cli-${VERSION}"
