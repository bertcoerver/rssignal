# Home Assistant add-on manifest.
#
# This is a *local* add-on: the folder is copied to /addons/rssignal on the
# Home Assistant host and built there, rather than pulled from a registry. That
# is why there is no `image:` key — its absence is what tells Supervisor to
# build the Dockerfile next to this file.
name: rssignal
version: "0.2.0"
slug: rssignal
description: Forward RSS feeds to Signal, on a machine that never sleeps
url: https://github.com/bertcoerver/rssignal

# aarch64 is the Raspberry Pi 4/5; amd64 is here because the image builds and
# works there too, and an add-on that silently refuses to install on the one
# machine someone wants to try it on is a poor introduction.
arch:
  - aarch64
  - amd64

# The base image brings its own s6-overlay, so Supervisor must not insert its
# init on top of it.
init: false

# rssignal is a batch job on a timer, not a service anything waits for.
startup: application

# No ports, no ingress, no API access: this talks to Signal and to the feeds,
# and has no business inside Home Assistant itself.
map:
  # -> /config in the container. feeds.json lives here, so it can be edited
  #    with the File Editor or over Samba without rebuilding the image.
  - addon_config:rw
  # -> /media in the container: the folder the Media browser shows. Sent
  #    episodes are kept here for `media_keep_days`.
  - media:rw

options:
  account: ""
  link_mode: false
  on_start: wait
  schedule:
    - "01:30"
    - "06:30"
    - "15:00"
  media_keep_days: 14
  update_yt_dlp: true
  log_level: info

schema:
  # The E.164 number rssignal sends from — the account linked with
  # `link_mode` below. Required; the add-on refuses to start without it.
  account: str
  # Turn on, start the add-on, scan the QR code it puts in the Media browser,
  # turn off again. Nothing is sent while this is on. It exists because Home
  # Assistant 2026.6 removed the setting that allowed a shell into an add-on,
  # which is how linking used to be done.
  link_mode: bool
  # What to do the moment the add-on starts, before settling into the schedule.
  # `wait` is the normal answer. `dry-run` fetches every feed and sends nothing,
  # which is how you check a new feeds.json; `run` sends for real. Both exist
  # because there is no shell here to run them from.
  on_start: list(wait|dry-run|run)
  # Local times to run at, HH:MM. Keep three or so spread across the day: the
  # `EARLY` allowance in rssignal.episodic is sized for runs a few hours apart,
  # and a single daily run would make a "daily" feed drift to every other day.
  schedule:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  # How long a sent episode stays in /media. 0 keeps everything forever.
  media_keep_days: int(0,365)
  # YouTube extraction breaks often enough that a pinned yt-dlp rots. This is
  # the container's equivalent of the `brew upgrade yt-dlp` the macOS
  # Shortcut wrapper does on every run.
  update_yt_dlp: bool
  log_level: list(trace|debug|info|warning|error|fatal)
