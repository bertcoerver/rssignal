# Home Assistant add-on manifest.
#
# Installed from this repository (see repository.yaml at the root), and pulled
# as a ready-made image rather than built on the host: `image:` below is what
# tells Supervisor so. {arch} becomes aarch64 or amd64.
#
# `version` is not edited by hand. The "Release add-on" workflow bumps it, and
# only after both images are pushed — Supervisor offers an update the moment it
# sees a new version here, so bumping it first would offer one it cannot pull.
name: rssignal
version: "0.5.0"
slug: rssignal
image: ghcr.io/bertcoerver/{arch}-rssignal
description: Send what fetchit downloads to Signal groups, on a machine that never sleeps
url: https://github.com/bertcoerver/rssignal

# aarch64 is the Raspberry Pi 4/5; amd64 is here because the image builds and
# works there too, and an add-on that silently refuses to install on the one
# machine someone wants to try it on is a poor introduction.
arch:
  - aarch64
  - amd64

# The base image brings its own s6-overlay, so Supervisor must not insert its
# init on top of it.
init: false

startup: application

# The GUI, as a panel in Home Assistant's sidebar. Ingress means Home Assistant
# signs you in and proxies the page; no port is published on your network.
ingress: true
ingress_port: 8099
panel_icon: mdi:message-processing
panel_title: rssignal

# Home Assistant reaches the send API on the same port, over its own internal
# network, at http://<this add-on's hostname>:8099 — see DOCS.md.
map:
  # -> /config in the container. feeds.json lives here, so it can be edited
  #    with the File Editor or over Samba without rebuilding the image.
  - addon_config:rw
  # -> /media in the container: where the fetchit add-on files everything it
  #    downloads (/media/fetchit), which is what rssignal sends from. Writable
  #    only for the linking QR code; rssignal never writes to the library.
  - media:rw

options:
  account: ""
  link_mode: false
  on_start: wait
  schedule:
    - "01:30"
    - "06:30"
    - "15:00"
  library: /media/fetchit
  api_allow:
    - 172.30.32.1
  api_token: ""
  log_level: info

schema:
  # The E.164 number rssignal sends from — the account linked with
  # `link_mode` below. Required; the add-on refuses to start without it.
  account: str
  # Turn on, start the add-on, scan the QR code it puts in the Media browser,
  # turn off again. Nothing is sent while this is on. It exists because Home
  # Assistant 2026.6 removed the setting that allowed a shell into an add-on,
  # which is how linking used to be done.
  link_mode: bool
  # What to do the moment the add-on starts, before settling into the schedule.
  # `wait` is the normal answer. `dry-run` reads every feed and sends nothing,
  # which is how you check a new feeds.json; `run` sends for real. Both exist
  # because there is no shell here to run them from.
  on_start: list(wait|dry-run|run)
  # Local times to run at, HH:MM. Empty runs only when asked, from the panel. Keep three or so spread across the day: the
  # `EARLY` allowance in rssignal.episodic is sized for runs a few hours apart,
  # and a single daily run would make a "daily" feed drift to every other day.
  schedule:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  # The library the fetchit add-on downloads into. Put this add-on's runs a
  # little after fetchit's, so each finds what the last download brought.
  library: str
  # Who may send through rssignal without the token: Home Assistant itself is
  # 172.30.32.1. A refused address is named in the log, to add here.
  api_allow:
    - str
  # A bearer token that lets anything on Home Assistant's network send, for
  # rest_command or another add-on. Empty: only the addresses above.
  api_token: password?
  log_level: list(trace|debug|info|warning|error|fatal)
